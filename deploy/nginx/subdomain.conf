# ============================================================
# Nginx Reverse Proxy Configuration for Mausam Bharat Subdomain
# Place in: /etc/nginx/sites-available/weather.conf
# Enable: ln -s /etc/nginx/sites-available/weather.conf /etc/nginx/sites-enabled/
# Test & Reload: nginx -t && systemctl reload nginx
# SSL Setup: certbot --nginx -d weather.yourdomain.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name weather.yourdomain.com; # Replace with your subdomain

    # Redirect HTTP to HTTPS once SSL certificate is installed by Certbot
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # Forward to Docker container running on 127.0.0.1 (isolated from external network)
        # Match APP_PORT in your .env (default 3000)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Host & Client IP Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Static assets caching for Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
